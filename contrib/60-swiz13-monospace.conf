<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Optional: make Swiz13 the preferred font whenever an application asks for "monospace".
     Installed by "install.sh" with the monospace option, per user in ~/.config/fontconfig/conf.d/ -->
<fontconfig>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Swiz13</family></prefer>
  </alias>
</fontconfig>
